#cloud-config

package_update: true
packages:
  - git
  - python3
  - python3-pip
  - curl

write_files:
  - path: /etc/default/stock-kline-cache
    owner: root:root
    permissions: '0600'
    content: |
      CLOUDBASE_ENV_ID=cloudbase-d9gplq92zc1d88ee6
      CLOUDBASE_REGION=ap-shanghai
      CLOUDBASE_APIKEY=eyJhbGciOiJSUzI1NiIsImtpZCI6IjlkMWRjMzFlLWI0ZDAtNDQ4Yi1hNzZmLWIwY2M2M2Q4MTQ5OCJ9..MdtAtVTBv1O6e1GZ0oEKhD1zTeV6hFhE8Nzxjbyv86nr1fpSgZDh8erM0UZTJXXBzh8Ln7IfxU2Lw1_mZ__VyamFbF9sTyiLeRt8XjlLJh2mJmcfmrJ5KKLrK6f9dfIaTGOfIgy4xbGE-TkhX42QUd7Ib0JZZzYjFH7tPhCSI4Y6IPz733gIzoVyjiqUZSD8nvnlHtQfoeU3WQ8iNQL73GuaKnirQK5CP3A_-ZRlWFqfl-ZQDed1avv1PxNJilAiPswsaobHeIlqfs_kKzIaffsBkvjO6uVOZWwFOltOETsSXSq5XivwOG5_wIEFfhtyR7lviwzzKp4S3Jp1-14tiw
      CLOUD_PREFIX=stock-kline-cache/latest
      MANIFEST_PATH=/opt/stock/build/stock-kline-cache/cloudbase-upload-manifest.json

runcmd:
  - [ bash, -lc, "set -euo pipefail; if [ ! -d /opt/stock/.git ]; then git clone https://github.com/sinbawang/stock /opt/stock; fi" ]
  - [ bash, -lc, "set -euo pipefail; cd /opt/stock; git fetch --all --prune; git checkout main; git pull --ff-only" ]
  - [ bash, -lc, "set -euo pipefail; cd /opt/stock; if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi" ]
  - [ bash, -lc, "set -euo pipefail; cd /opt/stock; chmod +x bin/linux/*.sh" ]
  - [ bash, -lc, "set -euo pipefail; cd /opt/stock; SERVICE_USER=ubuntu WORKING_DIR=/opt/stock CLOUD_PREFIX=stock-kline-cache/latest MANIFEST_PATH=/opt/stock/build/stock-kline-cache/cloudbase-upload-manifest.json bash bin/linux/install_kline_cache_backup_systemd.sh" ]
  - [ bash, -lc, "set -euo pipefail; systemctl start stock-kline-cache-backup.service" ]

final_message: "cloud-init finished: kline cache backup services installed and first backup triggered"
